<!doctype html>
<!-- HiAstra / HTML — structure, attributes, and meaningful content -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HiAstra — Palette Preview</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="palette" id="preview" aria-labelledby="theme-name">
      <header class="palette__header">
        <span class="eyebrow">A dark foundation. A colorful perspective.</span>
        <h1 id="theme-name">HiAstra <span>Theme</span></h1>
        <p>Vibrant code. Calm surroundings.</p>
      </header>

      <section class="swatches" aria-label="Syntax color palette">
        <article class="swatch" data-kind="function">
          <h2>Orbit</h2>
          <p>Functions &amp; methods</p>
          <code>#6FA8FF</code>
        </article>
        <article class="swatch" data-kind="string">
          <h2>Aurora</h2>
          <p>Strings &amp; literals</p>
          <code>#72E0B2</code>
        </article>
      </section>

      <footer>Built for clarity, with room for color.</footer>
    </main>
  </body>
</html>
